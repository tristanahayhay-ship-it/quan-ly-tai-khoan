<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Excel AI Robot Đa Năng</title>
    
    <!-- Tải CSS thư viện bảng tính Luckysheet -->
    <link rel='stylesheet' href='https://jsdelivr.net' />
    <link rel='stylesheet' href='https://jsdelivr.net' />
    <link rel='stylesheet' href='https://jsdelivr.net' />
    <link rel='stylesheet' href='https://jsdelivr.net' />
    
    <!-- Tải các JS thư viện hệ thống và xử lý file -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #top-bar {
            height: 50px; background-color: #107c41; color: white;
            display: flex; align-items: center; padding: 0 20px;
            font-size: 16px; font-weight: bold; justify-content: space-between;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
        }
        #export-btn {
            background-color: #ffffff; color: #107c41; border: 1px solid #ffffff;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        #export-btn:hover { background-color: #f1f1f1; }
        #main-container {
            display: flex; position: absolute; top: 50px; bottom: 0; left: 0; right: 0;
        }
        #luckysheet-container { flex: 3; height: 100%; position: relative; }
        #ai-sidebar {
            flex: 1; min-width: 340px; max-width: 420px;
            background-color: #f8f9fa; border-left: 2px solid #dee2e6;
            display: flex; flex-direction: column;
        }
        .ai-title { background-color: #0078d4; color: white; padding: 12px 15px; font-weight: bold; }
        .api-config-box { padding: 10px 15px; background-color: #e2e3e5; border-bottom: 1px solid #d3d3d4; font-size: 13px; }
        .api-input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 12px; border-radius: 8px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .user-msg { background-color: #d1e7dd; align-self: flex-end; color: #0f5132; }
        .bot-msg { background-color: #fff; border: 1px solid #dee2e6; align-self: flex-start; color: #212529; }
        .chat-image-preview { max-width: 150px; border-radius: 4px; margin-top: 5px; display: block; }
        .controls-area { border-top: 1px solid #dee2e6; background-color: #fff; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .upload-row { display: flex; gap: 10px; align-items: center; }
        .upload-label {
            background-color: #e1dfdd; color: #323130; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; gap: 5px; border: 1px solid #8a8886;
        }
        .upload-label:hover { background-color: #d2d0ce; }
        #file-input { display: none; }
        #file-status { font-size: 12px; color: #605e5c; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .input-row { display: flex; gap: 8px; }
        #user-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        #send-btn { background-color: #107c41; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #send-btn:hover { background-color: #0b592e; }
    </style>
</head>
<body>

    <div id="top-bar">
        <span>📊 Bảng tính Excel Hệ thống kết hợp Robot Đa Phương Tiện</span>
        <button id="export-btn" onclick="exportToExcel()">📥 Xuất file Excel (.xlsx)</button>
    </div>

    <div id="main-container">
        <div id="luckysheet-container"></div>

        <div id="ai-sidebar">
            <div class="ai-title">🤖 Robot Copilot Vision & Data</div>
            <div class="api-config-box">
                <label for="api-key-field">🔑 <strong>Nhập Key Bí Mật của bạn:</strong></label>
                <input type="password" id="api-key-field" class="api-input" placeholder="Dán mã API Key của bạn để kích hoạt...">
            </div>
            <div id="chat-box">
                <div class="msg bot-msg">Xin chào! Bạn có thể <b>bấm nút đính kèm 📎</b> để tải lên ảnh chụp hóa đơn hoặc bảng biểu, sau đó ra lệnh để tôi điền vào Excel nhé!</div>
            </div>
            <div class="controls-area">
                <div class="upload-row">
                    <label for="file-input" class="upload-label">📎 Đính kèm Ảnh / Tệp</label>
                    <input type="file" id="file-input" accept="image/*,application/pdf,text/plain" onchange="handleFileSelect()">
                    <span id="file-status">Chưa có tệp nào được chọn</span>
                </div>
                <div class="input-row">
                    <input type="text" id="user-input" placeholder="Bảo gì làm nấy..." onkeypress="if(event.key === 'Enter') sendToAI()">
                    <button id="send-btn" onclick="sendToAI()">Gửi</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        let selectedFileBase64 = null;
        let selectedFileType = null;

        // Khởi tạo giao diện ô lưới Excel
        $(function () {
            var options = {
                container: 'luckysheet-container',
                title: 'Workspace_Robot_Vision',
                lang: 'zh',
                showinfobar: false,
                showtoolbar: true,
                showsheetbar: true,
                data: [{ "name": "Sheet1", "status": "1", "order": "0", "celldata": [] }]
            };
            luckysheet.create(options);
        });

        // Xử lý khi người dùng chọn File từ máy tính
        function handleFileSelect() {
            const fileInput = document.getElementById('file-input');
            const fileStatus = document.getElementById('file-status');
            const file = fileInput.files[0];

            if (!file) {
                selectedFileBase64 = null;
                selectedFileType = null;
                fileStatus.innerText = "Chưa có tệp nào được chọn";
                return;
            }

            fileStatus.innerText = file.name;
            selectedFileType = file.type;

            const reader = new FileReader();
            reader.onload = function (e) {
                // Chuyển file thành chuỗi dữ liệu Base64 gửi cho Robot đọc
                selectedFileBase64 = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }
        // Hàm ra lệnh và gửi dữ liệu cho Robot xử lý
        async function sendToAI() {
            let inputField = document.getElementById('user-input');
            let apiKeyField = document.getElementById('api-key-field');
            let query = inputField.value.trim();
            let apiKey = apiKeyField.value.trim();

            if (!query && !selectedFileBase64) return;
            if (!apiKey) {
                alert("Vui lòng nhập mã Key cấu hình ở khung phía trên trước!");
                return;
            }

            let chatBox = document.getElementById('chat-box');
            let userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'msg user-msg';
            userMsgDiv.innerText = query || "Đã gửi một tệp tài liệu để xử lý.";
            
            if (selectedFileBase64 && selectedFileType.startsWith('image/')) {
                let imgPreview = document.createElement('img');
                imgPreview.src = `data:${selectedFileType};base64,${selectedFileBase64}`;
                imgPreview.className = 'chat-image-preview';
                userMsgDiv.appendChild(imgPreview);
            }
            chatBox.appendChild(userMsgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            inputField.value = '';
            let loadingId = appendMessage("🤖 Robot đang quét dữ liệu và ghi vào ô lưới...", 'bot-msg');

            try {
                const systemPrompt = `Bạn là mắt thần AI điều khiển Excel. Nhiệm vụ của bạn là đọc hình ảnh hoặc văn bản tài liệu người dùng tải lên, kết hợp với yêu cầu của họ, sau đó trích xuất thành JSON mảng. Không giải thích gì thêm ngoài JSON.
Định dạng JSON bắt buộc: [{"row": số_hàng, "col": số_cột, "val": giá_trị_hoặc_công_thức}]`;

                let messageContent = [];
                messageContent.push({ type: "text", text: query || "Hãy đọc dữ liệu từ tệp này và dựng thành bảng tính Excel." });

                if (selectedFileBase64) {
                    messageContent.push({
                        type: "image_url",
                        image_url: { url: `data:${selectedFileType};base64,${selectedFileBase64}` }
                    });
                }

                const response = await fetch("https://openai.com", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: messageContent }
                        ],
                        temperature: 0.1
                    })
                });

                const rawData = await response.json();
                if (rawData.error) {
                    document.getElementById(loadingId).innerText = "❌ Lỗi kết nối Robot: " + rawData.error.message;
                    return;
                }

                let aiTextResponse = rawData.choices[0].message.content.trim();
                if(aiTextResponse.startsWith("```json")) {
                    aiTextResponse = aiTextResponse.replace(/```json|```/g, "").trim();
                }

                let cellDataArray = JSON.parse(aiTextResponse);
                if (Array.isArray(cellDataArray)) {
                    cellDataArray.forEach(cell => {
                        if (cell.val && typeof cell.val === 'string' && cell.val.startsWith('=')) {
                            luckysheet.setCellValue(cell.row, cell.col, { f: cell.val });
                        } else {
                            luckysheet.setCellValue(cell.row, cell.col, cell.val);
                        }
                    });
                    luckysheet.refresh();
                    document.getElementById(loadingId).innerText = "✅ Robot đã ghi dữ liệu vào bảng tính thành công!";
                } else {
                    document.getElementById(loadingId).innerText = "🤖 Dữ liệu phân tích từ file không đúng cấu trúc dòng cột.";
                }
            } catch (error) {
                document.getElementById(loadingId).innerText = "❌ Lỗi hệ thống khi xử lý. Hãy kiểm tra lại Key!";
            } finally {
                document.getElementById('file-input').value = "";
                document.getElementById('file-status').innerText = "Chưa có tệp nào được chọn";
                selectedFileBase64 = null; selectedFileType = null;
            }
        }

        // Chức năng xuất file .xlsx về máy tính
        function exportToExcel() {
            let sheets = luckysheet.getluckysheetfile();
            if (!sheets || sheets.length === 0) return alert("Bảng tính trống!");

            let workbook = new ExcelJS.Workbook();
            sheets.forEach(sheet => {
                let worksheet = workbook.addWorksheet(sheet.name);
                let matrix = luckysheet.transToCellData(sheet.data);
                if(matrix){
                    matrix.forEach(cell => {
                        let row = cell.r + 1; let col = cell.c + 1; let cellValue = cell.v;
                        if (cellValue) {
                            let cellObj = worksheet.getCell(row, col);
                            if (cellValue.f) {
                                cellObj.value = { formula: cellValue.f.substring(1), result: cellValue.v };
                            } else {
                                cellObj.value = cellValue.v !== undefined ? cellValue.v : cellValue.m;
                            }
                        }
                    });
                }
            });
            workbook.xlsx.writeBuffer().then(buffer => {
                saveAs(new Blob([buffer]), "Excel_Tu_Robot_Thong_Minh.xlsx");
            });
        }

        function appendMessage(text, className) {
            let chatBox = document.getElementById('chat-box');
            let msgDiv = document.createElement('div');
            let uniqueId = "msg-" + Date.now();
            msgDiv.id = uniqueId; msgDiv.className = `msg ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return uniqueId;
        }
    </script>
</body>
</html>
