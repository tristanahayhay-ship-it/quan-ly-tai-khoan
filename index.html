<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel AI Copilot - Hệ Thống Bảng Tính Thông Minh</title>

    <!-- Handsontable -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.2.0/dist/handsontable.full.min.css">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f3f3f3;
        }

        #topBar {
            height: 50px;
            background: #107c41;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        #topBarTitle {
            font-size: 18px;
            font-weight: 700;
        }

        #exportBtn {
            border: 0;
            background: white;
            color: #107c41;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

        #mainContainer {
            display: flex;
            width: 100vw;
            height: calc(100vh - 50px);
            overflow: hidden;
        }

        #excelZone {
            flex: 75%;
            min-width: 0;
            background: #f5f5f5;
            padding: 14px;
            overflow: hidden;
            border-right: 1px solid #ddd;
        }

        #spreadsheetContainer {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        #aiSidebar {
            flex: 25%;
            min-width: 340px;
            background: #f8f9fa;
            border-left: 1px solid #dadce0;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #sidebarHeader {
            background: #1a73e8;
            color: white;
            font-weight: 700;
            padding: 12px 14px;
            font-size: 15px;
        }

        #apiConfigBox {
            padding: 12px 14px;
            background: #e8f0fe;
            border-bottom: 1px solid #d2e3fc;
        }

        #apiKeyInput {
            width: 100%;
            padding: 8px 10px;
            margin-top: 6px;
            border-radius: 4px;
            border: 1px solid #1a73e8;
            font-size: 13px;
        }

        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            background: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chatMessage {
            display: flex;
            width: 100%;
        }

        .chatMessage.user {
            justify-content: flex-end;
        }

        .chatMessage.bot {
            justify-content: flex-start;
        }

        .chatBubble {
            max-width: 88%;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .chatBubble.user {
            background: #e8f0fe;
            color: #1a73e8;
            border-bottom-right-radius: 3px;
        }

        .chatBubble.bot {
            background: #f3f4f6;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 3px;
        }

        .chatBubble.bot.error {
            background: #fee2e2;
            color: #b91c1c;
            border-color: #fca5a5;
        }

        .chatBubble.bot.success {
            background: #dcfce7;
            color: #166534;
            border-color: #86efac;
        }

        .chatImage {
            display: block;
            max-width: 160px;
            margin-top: 8px;
            border-radius: 4px;
        }

        #controlsArea {
            border-top: 1px solid #e0e0e0;
            background: white;
            padding: 10px 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .uploadRow {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .uploadLabel {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 4px;
            border: 1px solid #dadce0;
            background: #f1f3f4;
            font-size: 12px;
            font-weight: 600;
            color: #3c4043;
            cursor: pointer;
        }

        #fileInput { display: none; }

        #fileStatus {
            flex: 1;
            min-width: 0;
            color: #5f6368;
            font-size: 11px;
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .inputRow {
            display: flex;
            gap: 8px;
        }

        #userInput {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 13px;
        }

        #sendBtn {
            border: 0;
            background: #1a73e8;
            color: white;
            font-weight: 700;
            border-radius: 4px;
            padding: 8px 14px;
            cursor: pointer;
        }

        #sendBtn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        @media (max-width: 900px) {
            #mainContainer {
                flex-direction: column;
            }
            #excelZone {
                flex: 1;
                min-height: 50vh;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }
            #aiSidebar {
                flex: 1;
                min-width: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="topBar">
        <div id="topBarTitle">📊 Excel AI Copilot - Hệ Thống Bảng Tính Thông Minh</div>
        <button id="exportBtn">📥 Xuất Excel</button>
    </div>

    <div id="mainContainer">
        <div id="excelZone">
            <div id="spreadsheetContainer"></div>
        </div>

        <div id="aiSidebar">
            <div id="sidebarHeader">🤖 Robot Gemini Copilot</div>

            <div id="apiConfigBox">
                <label for="apiKeyInput">🔑 Google Gemini API Key</label>
                <input id="apiKeyInput" type="password" placeholder="Dán API Key của bạn vào đây...">
            </div>

            <div id="chatBox"></div>

            <div id="controlsArea">
                <div class="uploadRow">
                    <label for="fileInput" class="uploadLabel">📎 Ảnh</label>
                    <input id="fileInput" type="file" accept="image/*">
                    <span id="fileStatus">Chưa chọn</span>
                </div>
                <div class="inputRow">
                    <input id="userInput" type="text" placeholder="Nhập lệnh..."><button id="sendBtn">Gửi</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/handsontable@14.2.0/dist/handsontable.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

    <script>
        const app = {
            spreadsheet: null,
            selectedFile: { base64: null, mimeType: null, name: null },
            isProcessing: false,
            selectedModel: null
        };

        function addChatMessage(text, type = 'bot', status = 'normal') {
            const chatBox = document.getElementById('chatBox');
            const wrapper = document.createElement('div');
            wrapper.className = `chatMessage ${type}`;

            const bubble = document.createElement('div');
            bubble.className = `chatBubble ${type}`;
            if (status !== 'normal') bubble.classList.add(status);
            bubble.textContent = text;

            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return wrapper;
        }

        function updateChatMessage(messageEl, text, status = 'normal') {
            const bubble = messageEl.querySelector('.chatBubble');
            bubble.textContent = text;
            bubble.className = 'chatBubble bot';
            if (status !== 'normal') bubble.classList.add(status);
        }

        function addImageToLastMessage(base64, mimeType) {
            const chatBox = document.getElementById('chatBox');
            const lastMessage = chatBox.lastElementChild;
            if (!lastMessage) return;

            const bubble = lastMessage.querySelector('.chatBubble');
            const img = document.createElement('img');
            img.src = `data:${mimeType};base64,${base64}`;
            img.alt = 'Ảnh đã chọn';
            img.className = 'chatImage';
            bubble.appendChild(img);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function initSpreadsheet() {
            try {
                const container = document.getElementById('spreadsheetContainer');
                app.spreadsheet = new Handsontable(container, {
                    data: Array.from({ length: 30 }, () => Array(12).fill('')),
                    rowHeaders: true,
                    colHeaders: true,
                    contextMenu: true,
                    height: '100%',
                    width: '100%',
                    rowHeights: 25,
                    colWidths: 120,
                    licenseKey: 'non-commercial-and-evaluation',
                    manualRowResize: true,
                    manualColumnResize: true,
                    stretchH: 'all',
                    autoWrapRow: true,
                    autoWrapCol: true,
                    copyPaste: true,
                    undo: true,
                    filters: true,
                    dropdownMenu: true,
                });
                console.log('✅ Spreadsheet initialized');
                addChatMessage('✅ Bảng tính sẵn sàng! Hãy dán API Key và bắt đầu.', 'bot', 'success');
            } catch (error) {
                console.error('Spreadsheet init error:', error);
                addChatMessage(`❌ Lỗi khởi tạo: ${error.message}`, 'bot', 'error');
            }
        }

        document.getElementById('fileInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const status = document.getElementById('fileStatus');

            if (!file) {
                app.selectedFile = { base64: null, mimeType: null, name: null };
                status.textContent = 'Chưa chọn';
                return;
            }

            if (!file.type.startsWith('image/')) {
                status.textContent = 'Vui lòng chọn ảnh';
                alert('Vui lòng chọn file ảnh hợp lệ');
                return;
            }

            status.textContent = file.name.length > 18 ? file.name.slice(0, 18) + '...' : file.name;
            app.selectedFile.mimeType = file.type;
            app.selectedFile.name = file.name;

            const reader = new FileReader();
            reader.onload = function (e) {
                app.selectedFile.base64 = e.target.result.split(',')[1];
            };
            reader.onerror = function () {
                status.textContent = 'Lỗi đọc ảnh';
                addChatMessage('❌ Lỗi đọc ảnh', 'bot', 'error');
            };
            reader.readAsDataURL(file);
        });

        async function getAvailableGeminiModels(apiKey) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
            const response = await fetch(url, { method: 'GET' });
            if (!response.ok) {
                const body = await response.json().catch(() => ({}));
                throw new Error(body.error?.message || `HTTP ${response.status}`);
            }
            const data = await response.json();
            const models = Array.isArray(data.models) ? data.models : [];
            return models
                .map(m => ({ name: m.name, methods: m.supportedGenerationMethods || [] }))
                .filter(m => m.methods.includes('generateContent'))
                .map(m => m.name.replace(/^models\//, ''));
        }

        async function resolveGeminiModel(apiKey) {
            const preferred = [
                'gemini-3.8-flash',
                'gemini-3.7-flash',
                'gemini-3.6-flash',
                'gemini-3.5-flash',
                'gemini-2.5-flash',
                'gemini-2.5-pro',
                'gemini-2.0-flash',
                'gemini-1.5-pro',
                'gemini-1.5-flash'
            ];

            const available = await getAvailableGeminiModels(apiKey);
            console.log('Available Gemini models:', available);

            if (!available.length) {
                throw new Error('API Key hợp lệ nhưng không có model nào hỗ trợ generateContent trong tài khoản của bạn. Vui lòng kiểm tra quyền truy cập Gemini API.');
            }

            const found = preferred.find(model => available.includes(model));
            if (found) return found;

            return available[0];
        }

        async function sendToGemini() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const userInput = document.getElementById('userInput');
            const query = userInput.value.trim();

            if (!query && !app.selectedFile.base64) {
                alert('Vui lòng nhập lệnh hoặc chọn ảnh');
                return;
            }

            if (!apiKey) {
                addChatMessage('❌ Vui lòng nhập Google Gemini API Key!', 'bot', 'error');
                return;
            }

            app.isProcessing = true;
            document.getElementById('sendBtn').disabled = true;

            try {
                addChatMessage(query || '📸 Đã gửi hình ảnh', 'user');
                if (app.selectedFile.base64) addImageToLastMessage(app.selectedFile.base64, app.selectedFile.mimeType);

                const processingMsg = addChatMessage('⏳ Robot đang xử lý...', 'bot');

                app.selectedModel = await resolveGeminiModel(apiKey);
                console.log('Selected Gemini model:', app.selectedModel);

                const systemPrompt = `Bạn là trợ lý AI chuyên biệt điền dữ liệu vào bảng tính Excel.

NHIỆM VỤ: Phân tích yêu cầu hoặc ảnh, sau đó trả về JSON để điền lên bảng tính.

ĐỊNH DẠNG JSON BẮT BUỘC:
[{"row": 0, "col": 0, "val": "Tên cột"}, {"row": 1, "col": 0, "val": "Giá trị"}]

QUY TẮC:
- row: 0 = hàng 1, 1 = hàng 2, ...
- col: 0 = cột A, 1 = cột B, ...
- Nếu là công thức Excel, dùng chuỗi bắt đầu bằng =, ví dụ "=SUM(B2:B10)"
- CHỈ trả về JSON, không có markdown, không có giải thích.`;

                const parts = [{ text: systemPrompt + '\n\nYêu cầu: ' + (query || 'Đọc dữ liệu trong ảnh') }];

                if (app.selectedFile.base64) {
                    parts.push({
                        inlineData: {
                            mimeType: app.selectedFile.mimeType,
                            data: app.selectedFile.base64
                        }
                    });
                }

                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${app.selectedModel}:generateContent?key=${apiKey}`;
                console.log('Calling Gemini endpoint:', endpoint);

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts }],
                        generationConfig: {
                            temperature: 0.1,
                            maxOutputTokens: 2048
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }

                const json = await response.json();
                console.log('Gemini raw response:', json);

                if (!json.candidates?.[0]?.content?.parts?.[0]?.text) {
                    throw new Error('Gemini không trả về dữ liệu hợp lệ');
                }

                let responseText = json.candidates[0].content.parts[0].text.trim();
                if (responseText.includes('```')) {
                    responseText = responseText.replace(/```json\n?|\n?```/g, '').trim();
                }

                const parsed = JSON.parse(responseText);
                if (!Array.isArray(parsed)) throw new Error('Dữ liệu trả về không phải mảng JSON');

                let count = 0;
                parsed.forEach(cell => {
                    if (app.spreadsheet && typeof cell.row === 'number' && typeof cell.col === 'number' && cell.val !== null && cell.val !== undefined) {
                        try {
                            app.spreadsheet.setDataAtCell(cell.row, cell.col, String(cell.val));
                            count++;
                        } catch (err) {
                            console.warn('Set cell error:', err, cell);
                        }
                    }
                });

                updateChatMessage(processingMsg, `✅ Đã điền ${count} ô dữ liệu!`, 'success');

            } catch (error) {
                console.error('Gemini error:', error);
                addChatMessage(`❌ Lỗi: ${error.message}`, 'bot', 'error');
            } finally {
                app.isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('fileInput').value = '';
                document.getElementById('fileStatus').textContent = 'Chưa chọn';
                app.selectedFile = { base64: null, mimeType: null, name: null };
                document.getElementById('userInput').value = '';
                document.getElementById('userInput').focus();
            }
        }

        document.getElementById('sendBtn').addEventListener('click', function () {
            if (app.isProcessing) return;
            const query = document.getElementById('userInput').value.trim();
            if (!query && !app.selectedFile.base64) {
                alert('Vui lòng nhập lệnh hoặc chọn ảnh');
                return;
            }
            sendToGemini();
        });

        document.getElementById('userInput').addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && !app.isProcessing) {
                event.preventDefault();
                sendToGemini();
            }
        });

        document.getElementById('exportBtn').addEventListener('click', async function () {
            if (!app.spreadsheet) {
                alert('Bảng tính chưa sẵn sàng');
                return;
            }

            try {
                const data = app.spreadsheet.getData();
                const workbook = new ExcelJS.Workbook();
                const sheet = workbook.addWorksheet('Báo Cáo');

                data.forEach((row, rowIndex) => {
                    row.forEach((cellValue, colIndex) => {
                        if (cellValue !== '' && cellValue !== null && cellValue !== undefined) {
                            const cell = sheet.getCell(rowIndex + 1, colIndex + 1);
                            if (typeof cellValue === 'string' && cellValue.startsWith('=')) {
                                cell.value = { formula: cellValue.substring(1) };
                            } else if (!isNaN(cellValue)) {
                                cell.value = Number(cellValue);
                            } else {
                                cell.value = cellValue;
                            }
                        }
                    });
                });

                const buffer = await workbook.xlsx.writeBuffer();
                saveAs(new Blob([buffer]), 'Bao_Cao_Excel_Gemini.xlsx');
                addChatMessage('✅ File Excel đã được tải xuống!', 'bot', 'success');
            } catch (error) {
                console.error('Export error:', error);
                addChatMessage(`❌ Lỗi xuất Excel: ${error.message}`, 'bot', 'error');
            }
        });

        window.addEventListener('load', function () {
            initSpreadsheet();
            addChatMessage('👋 Chào bạn! Hãy dán API Key và gửi lệnh hoặc ảnh.', 'bot');
            document.getElementById('apiKeyInput').focus();
        });
    </script>
</body>
</html>
