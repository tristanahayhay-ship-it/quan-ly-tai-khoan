<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Excel Gemini Robot Siêu Cấp</title>
    
    <!-- Tải thư viện bảng tính ổn định cao -->
    <link rel="stylesheet" href="https://jsdelivr.net" type="text/css" />
    <link rel="stylesheet" href="https://jsdelivr.net" type="text/css" />
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #top-bar {
            height: 50px; background-color: #107c41; color: white;
            display: flex; align-items: center; padding: 0 20px;
            font-size: 16px; font-weight: bold; justify-content: space-between;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
        }
        #export-btn {
            background-color: #ffffff; color: #107c41; border: 1px solid #ffffff;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        #export-btn:hover { background-color: #f1f1f1; }
        #main-container {
            display: flex; position: absolute; top: 50px; bottom: 0; left: 0; right: 0;
        }
        #excel-zone { 
            flex: 3; height: 100%; overflow: auto; padding: 20px; box-sizing: border-box; background-color: #f4f6f9;
        }
        #ai-sidebar {
            flex: 1; min-width: 340px; max-width: 420px;
            background-color: #f8f9fa; border-left: 2px solid #dee2e6;
            display: flex; flex-direction: column;
        }
        .ai-title { background-color: #1a73e8; color: white; padding: 12px 15px; font-weight: bold; }
        .api-config-box { padding: 10px 15px; background-color: #e8f0fe; border-bottom: 1px solid #d2e3fc; font-size: 13px; }
        .api-input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 5px; border: 1px solid #1a73e8; border-radius: 4px; }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 12px; border-radius: 8px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .user-msg { background-color: #e8f0fe; align-self: flex-end; color: #1a73e8; }
        .bot-msg { background-color: #fff; border: 1px solid #dee2e6; align-self: flex-start; color: #212529; }
        .chat-image-preview { max-width: 150px; border-radius: 4px; margin-top: 5px; display: block; }
        .controls-area { border-top: 1px solid #dee2e6; background-color: #fff; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .upload-row { display: flex; gap: 10px; align-items: center; }
        .upload-label {
            background-color: #f1f3f4; color: #3c4043; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; gap: 5px; border: 1px solid #dadce0;
        }
        .upload-label:hover { background-color: #e8eaed; }
        #file-input { display: none; }
        #file-status { font-size: 12px; color: #5f6368; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .input-row { display: flex; gap: 8px; }
        #user-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        #send-btn { background-color: #1a73e8; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #send-btn:hover { background-color: #1557b0; }
    </style>
</head>
<body>

    <div id="top-bar">
        <span>📊 Bảng tính Excel Hệ thống kết hợp Robot Gemini Mới</span>
        <button id="export-btn" onclick="exportToExcel()">📥 Xuất file Excel (.xlsx)</button>
    </div>

    <div id="main-container">
        <!-- Vùng hiển thị ô lưới Excel mới -->
        <div id="excel-zone">
            <div id="spreadsheet"></div>
        </div>

        <div id="ai-sidebar">
            <div class="ai-title">🤖 Robot Gemini Copilot Intelligence</div>
            <div class="api-config-box">
                <label for="api-key-field">🔑 <strong>Nhập Key Google Gemini của bạn:</strong></label>
                <input type="password" id="api-key-field" class="api-input" placeholder="Dán mã Gemini API Key vào đây...">
            </div>
            <div id="chat-box">
                <div class="msg bot-msg">Chào bạn! Tôi đã làm lại hệ thống ô lưới Excel mới siêu ổn định. Hãy dán Key Gemini của bạn vào ô trên, sau đó ra lệnh để tôi điền tự động dữ liệu nhé!</div>
            </div>
            <div class="controls-area">
                <div class="upload-row">
                    <label for="file-input" class="upload-label">📎 Đính kèm Ảnh</label>
                    <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect()">
                    <span id="file-status">Chưa có ảnh nào được chọn</span>
                </div>
                <div class="input-row">
                    <input type="text" id="user-input" placeholder="Bảo gì làm nấy..." onkeypress="if(event.key === 'Enter') sendToAI()">
                    <button id="send-btn" onclick="sendToAI()">Gửi</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        let selectedFileBase64 = null;
        let selectedFileType = null;
        let tableInstance = null;

        // Khởi tạo bảng tính trống kích thước mặc định (20 hàng x 10 cột)
        function initExcelTable() {
            let initialData = [];
            for (let i = 0; i < 20; i++) {
                initialData.push(new Array(10).fill(''));
            }
            
            tableInstance = jspreadsheet(document.getElementById('spreadsheet'), {
                data: initialData,
                minDimensions:,
                tableOverflow: true,
                tableWidth: '100%',
                tableHeight: '90%',
                contextMenu: true // Bấm chuột phải để thêm hàng/cột thoải mái
            });
        }

        window.onload = function() {
            initExcelTable();
        };

        // Đọc và mã hóa ảnh thành Base64
        function handleFileSelect() {
            const fileInput = document.getElementById('file-input');
            const fileStatus = document.getElementById('file-status');
            const file = fileInput.files[0];

            if (!file) {
                selectedFileBase64 = null;
                selectedFileType = null;
                fileStatus.innerText = "Chưa có ảnh nào được chọn";
                return;
            }

            fileStatus.innerText = file.name;
            selectedFileType = file.type;

            const reader = new FileReader();
            reader.onload = function (e) {
                // Lấy chuỗi dữ liệu base64 thô
                selectedFileBase64 = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }
        // Xử lý gửi tin nhắn lệnh cấu trúc dữ liệu cho Gemini
        async function sendToAI() {
            let inputField = document.getElementById('user-input');
            let apiKeyField = document.getElementById('api-key-field');
            let query = inputField.value.trim();
            let apiKey = apiKeyField.value.trim();

            if (!query && !selectedFileBase64) return;
            if (!apiKey) {
                alert("Vui lòng điền mã khóa Gemini API Key vào ô phía trên!");
                return;
            }

            let chatBox = document.getElementById('chat-box');
            let userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'msg user-msg';
            userMsgDiv.innerText = query || "Đã gửi hình ảnh.";
            
            if (selectedFileBase64) {
                let imgPreview = document.createElement('img');
                imgPreview.src = `data:${selectedFileType};base64,${selectedFileBase64}`;
                imgPreview.className = 'chat-image-preview';
                userMsgDiv.appendChild(imgPreview);
            }
            chatBox.appendChild(userMsgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            inputField.value = '';
            let loadingId = appendMessage("🤖 Robot đang xử lý dữ liệu bảng...", 'bot-msg');

            try {
                const promptInstruct = `${query || "Đọc bảng dữ liệu trong ảnh"}
Bạn là trợ lý ảo điền dữ liệu vào bảng tính. Phân tích ảnh hoặc yêu cầu của người dùng, chuyển thông tin thành cấu trúc mảng JSON. Không giải thích gì thêm ngoài JSON.
Định dạng JSON bắt buộc: [{"row": số_hàng, "col": số_cột, "val": "giá_trị"}]
Lưu ý: Hàng đầu tiên (A1, B1...) có số_hàng là 0, số_cột là 0 (Cột A=0, B=1...). Các ô tính tổng hoặc công thức dùng chữ viết hoa như "=SUM(B2:B5)"`;

                let parts = [{ text: promptInstruct }];
                if (selectedFileBase64) {
                    parts.push({
                        inlineData: {
                            mimeType: selectedFileType,
                            data: selectedFileBase64
                        }
                    });
                }

                // Gọi tới mô hình gemini-2.5-flash của Google
                const url = `https://googleapis.com{apiKey}`;
                
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const rawData = await response.json();
                
                if (rawData.error) {
                    document.getElementById(loadingId).innerText = "❌ Lỗi: " + rawData.error.message;
                    return;
                }

                let aiTextResponse = rawData.candidates[0].content.parts[0].text.trim();
                
                if (aiTextResponse.includes("```")) {
                    aiTextResponse = aiTextResponse.replace(/```json|```/g, "").trim();
                }

                let cellDataArray = JSON.parse(aiTextResponse);
                
                if (Array.isArray(cellDataArray)) {
                    cellDataArray.forEach(cell => {
                        // Cập nhật giá trị trực tiếp vào ô lưới của hệ thống mới
                        tableInstance.setValueFromCoords(cell.col, cell.row, cell.val);
                    });
                    document.getElementById(loadingId).innerText = "✅ Robot đã điền dữ liệu thành công vào bảng tính!";
                } else {
                    document.getElementById(loadingId).innerText = "🤖 Robot phản hồi dữ liệu lỗi, vui lòng thử lại.";
                }

            } catch (error) {
                document.getElementById(loadingId).innerText = "❌ Gặp lỗi khi xử lý dữ liệu. Vui lòng kiểm tra lại Key hoặc độ nét của ảnh!";
                console.error(error);
            } finally {
                document.getElementById('file-input').value = "";
                document.getElementById('file-status').innerText = "Chưa có ảnh nào được chọn";
                selectedFileBase64 = null; selectedFileType = null;
            }
        }

        // Tải file .xlsx về máy tính
        function exportToExcel() {
            if (!tableInstance) return alert("Bảng tính trống!");
            let data = tableInstance.getData();
            
            let workbook = new ExcelJS.Workbook();
            let worksheet = workbook.addWorksheet('Sheet1');

            data.forEach((row, rowIndex) => {
                row.forEach((cellValue, colIndex) => {
                    if (cellValue !== '') {
                        let cellObj = worksheet.getCell(rowIndex + 1, colIndex + 1);
                        if (typeof cellValue === 'string' && cellValue.startsWith('=')) {
                            cellObj.value = { formula: cellValue.substring(1) };
                        } else {
                            cellObj.value = cellValue;
                        }
                    }
                });
            });

            workbook.xlsx.writeBuffer().then(buffer => {
                saveAs(new Blob([buffer]), "Bao_Cao_Excel_Moi.xlsx");
            });
        }

        function appendMessage(text, className) {
            let chatBox = document.getElementById('chat-box');
            let msgDiv = document.createElement('div');
            let uniqueId = "msg-" + Date.now();
            msgDiv.id = uniqueId; msgDiv.className = `msg ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return uniqueId;
        }
    </script>
</body>
</html>
