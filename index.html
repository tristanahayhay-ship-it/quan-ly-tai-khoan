<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Trị Tài Khoản Thông Minh</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR PHÂN CHIA KHU VỰC VẬN HÀNH -->
        <aside class="w-64 bg-gray-950 border-r border-gray-800 p-5 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="flex items-center gap-3 px-2 py-4 border-b border-gray-800 mb-6">
                    <span class="text-sm font-black text-white">⚙️ AUTO STATUS ROUTING</span>
                </div>
                <div class="space-y-4">
                    <div>
                        <p class="px-3 text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Thẻ Đang Chạy (Lên Sàn)</p>
                        <nav class="space-y-1 flex flex-col font-bold text-xs" id="menuNavActive"></nav>
                    </div>
                    <div>
                        <p class="px-3 pt-2 text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Kho Lưu Trữ (Hạ Sàn)</p>
                        <nav class="space-y-1 flex flex-col font-bold text-xs" id="menuNavHistory"></nav>
                    </div>
                </div>
            </div>
            <div class="p-3 bg-gray-900/50 rounded-xl border border-gray-800 text-[10px] font-bold text-blue-400 text-center shadow-inner">
                <i class="fa-solid fa-route mr-1"></i> ĐIỀU HƯỚNG THEO TRẠNG THÁI
            </div>
        </aside>
        <!-- KHÔNG GIAN BẢNG HIỂN THỊ CHÍNH -->
        <main class="flex-1 flex flex-col h-full bg-gray-900 overflow-y-auto">
            <header class="bg-gray-950 border-b border-gray-800 px-6 py-4 flex justify-between items-center sticky top-0 z-40 shadow-md">
                <div class="flex items-center gap-2">
                    <h2 class="text-sm font-black text-white uppercase tracking-wider" id="mainHeaderTitle">BK Personal</h2>
                    <span id="tabTypeBadge" class="px-2 py-0.5 rounded text-[10px] font-bold bg-green-500/10 text-green-400 border border-green-500/20">ĐANG CHẠY</span>
                </div>
                <div class="flex items-center gap-3">
                    <button id="topBtnAdd" onclick="openInputModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black uppercase rounded-lg shadow-md flex items-center gap-1.5"><i class="fa-solid fa-square-plus"></i> Thêm Thẻ</button>
                    <button onclick="dangerClearTab()" class="px-2 py-2 bg-gray-800 text-gray-400 hover:text-white text-xs font-bold rounded-lg border border-gray-700">Dọn sạch tab</button>
                </div>
            </header>
            
            <div class="p-6 space-y-4 w-full mx-auto text-xs">
                <div class="bg-gray-950 border border-gray-800 p-4 rounded-xl grid grid-cols-1 sm:grid-cols-3 gap-3 shadow-inner">
                    <div class="sm:col-span-2"><input type="text" id="systemSmartSearch" onkeyup="applySystemFilters()" placeholder="🔍 Tìm nhanh nhà thẻ, số thẻ, mốc thời gian..." class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none"></div>
                    <div><select id="systemStatusSelect" onchange="applySystemFilters()" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl font-bold text-gray-300 outline-none"><option value="">-- Tất cả trạng thái bảng --</option><option value="tắt">🔴 Trạng thái Tắt</option><option value="上架">🟢 Lên sàn (上架)</option><option value="下架">🔴 Hạ sàn (下架)</option></select></div>
                </div>
                <div class="bg-gray-950 border border-gray-800 rounded-2xl overflow-hidden shadow-2xl">
                    <div class="p-3 bg-gray-900 text-[11px] text-gray-400 flex justify-between font-bold border-b border-gray-800"><span>DANH SÁCH TÀI KHOẢN TRÊN KHÔNG GIAN BẢNG</span><span>Số lượng: <span id="widget-visible-count" class="text-blue-400">0</span> dòng</span></div>
                    <div class="overflow-x-auto"><table class="w-full text-left border-collapse text-[11px]" id="systemMainTable"><thead><tr class="bg-gray-950 text-gray-400 uppercase text-[10px] font-black border-b border-gray-800 tracking-wider" id="systemTableHeaderRow"></tr></thead><tbody id="systemTableBody" class="divide-y divide-gray-800 font-medium"></tbody></table></div>
                </div>
            </div>
        </main>
    </div>

    <!-- POP-UP ĐIỀN THÔNG TIN KHÁCH HÀNG ĐƯA -->
    <div id="inputModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-gray-950 border border-gray-800 p-6 rounded-2xl w-full max-w-md shadow-2xl text-xs relative">
            <button onclick="closeInputModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white text-base"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-[12px] font-black text-white uppercase mb-4 pb-2 border-b border-gray-800 flex items-center gap-1.5"><i class="fa-solid fa-receipt text-blue-500"></i> Thông tin cần điền lên hệ thống</h3>
            <form id="systemInputForm" onsubmit="processFormSubmit(event)" class="space-y-3">
                <div><label class="block font-bold text-gray-400 mb-0.5 uppercase">nhà thẻ</label><input type="text" id="form-ma" required class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white font-bold outline-none"></div>
                <div><label class="block font-bold text-gray-400 mb-0.5 uppercase">số thẻ</label><input type="text" id="form-stk" required class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl font-mono text-white outline-none"></div>
                <div><label class="block font-bold text-gray-400 mb-0.5 uppercase">hạn mức</label><input type="text" id="form-soluong" required class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white font-bold outline-none"></div>
                <div><label class="block font-bold text-gray-400 mb-0.5 uppercase">mật khẩu</label><input type="text" id="form-matkhau" required class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white font-mono outline-none"></div>
                <div><label class="block font-bold text-gray-400 mb-0.5 uppercase">ghi chú</label><input type="text" id="form-ghichu-extra" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none"></div>
                <div><label class="block font-bold text-gray-400 mb-0.5 uppercase">thời gian sử dụng</label><input type="text" id="form-ghichu" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none"></div>
                <div><label class="block font-bold text-gray-400 mb-0.5 uppercase">trạng thái mặc định</label><select id="form-trangthai" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white font-bold outline-none"><option value="上架">上架 (Lên sàn)</option><option value="下架 / tắt">下架 / tắt (Hạ sàn)</option></select></div>
                <div class="flex items-center gap-3 pt-2">
                    <button type="button" onclick="closeInputModal()" class="w-1/3 py-2.5 bg-gray-800 text-gray-300 font-bold rounded-xl uppercase">Hủy</button>
                    <button type="submit" class="w-2/3 py-2.5 bg-blue-600 text-white font-black rounded-xl uppercase shadow-md">Lưu liên tục</button>
                </div>
            </form>
        </div>
    </div>
    <div id="toastNotification" class="fixed bottom-5 right-5 px-4 py-3 bg-emerald-600 text-white font-bold text-xs uppercase rounded-xl shadow-2xl transition-all transform translate-y-20 opacity-0 z-50"></div>
    <script>
        const modules = [
            { id: 'BK_Personal', name: '💳 BK Personal', service: 'BK Personal' },
            { id: 'bKash', name: '📱 bKash', service: 'bkash' },
            { id: 'Nagad', name: '🍊 Nagad', service: 'nagad' },
            { id: 'Rocket', name: '🚀 Rocket', service: 'rocket' }
        ];
        
        let currentWallet = 'BK_Personal';
        let isHistoryTab = false;         

        const menuActive = document.getElementById('menuNavActive');
        const menuHistory = document.getElementById('menuNavHistory');
        
        modules.forEach(m => {
            menuActive.innerHTML += `<button type="button" onclick="switchModule('${m.id}', false)" id="menu-active-${m.id}" class="w-full flex items-center justify-between px-3 py-2 text-left font-bold rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-all"><span>${m.name}</span></button>`;
            menuHistory.innerHTML += `<button type="button" onclick="switchModule('${m.id}', true)" id="menu-history-${m.id}" class="w-full flex items-center justify-between px-3 py-2 text-left font-bold rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-all"><span>${m.name} Down</span></button>`;
        });

        function switchModule(walletId, isHistory) {
            currentWallet = walletId;
            isHistoryTab = isHistory;

            document.querySelectorAll('nav button').forEach(b => b.className = "w-full flex items-center justify-between px-3 py-2 text-left font-bold rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-all");
            
            const activeId = isHistory ? `menu-history-${walletId}` : `menu-active-${walletId}`;
            if(document.getElementById(activeId)) document.getElementById(activeId).className = "w-full flex items-center justify-between px-3 py-2 text-left font-black rounded-xl bg-blue-600/15 text-blue-400 border border-blue-500/20 transition-all";

            const meta = modules.find(m => m.id === walletId);
            document.getElementById('main-header-title').innerText = meta ? (isHistory ? meta.service + " [KHO LƯU TRỮ HẠ SÀN]" : meta.service) : walletId;
            
            const badge = document.getElementById('tabTypeBadge');
            if(isHistory) {
                badge.innerText = "ĐÃ HẠ SÀN / 下架"; badge.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/10 text-red-400 border border-red-500/20";
                document.getElementById('topBtnAdd').style.display = 'none';
            } else {
                badge.innerText = "ĐANG CHẠY / 上架"; badge.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-green-500/10 text-green-400 border border-green-500/20";
                document.getElementById('topBtnAdd').style.display = 'block';
            }

            const h = document.getElementById('systemTableHeaderRow');
            let sLabel = meta ? meta.service : 'Dịch vụ';
            // Bảng chuẩn 8 cột theo yêu cầu thực tế từ mẫu ảnh
            h.innerHTML = '<th class="p-3">nhà thẻ</th><th class="p-3">số thẻ</th><th class="p-3">' + sLabel + '</th><th class="p-3">hạn mức</th><th class="p-3">mật khẩu</th><th class="p-3">ghi chú</th><th class="p-3">thời gian sử dụng</th><th class="p-3 w-40">trạng thái (Tùy Chỉnh)</th><th class="p-3 text-right">Thao Tác</th>';
            
            loadLocalData();
        }

        function getStorageKey(isHistory) { return (isHistory ? 'db_down_' : 'db_up_') + currentWallet; }
        function loadLocalData() { populateSystemTable(localStorage.getItem(getStorageKey(isHistoryTab)) ? JSON.parse(localStorage.getItem(getStorageKey(isHistoryTab))) : []); }
        function populateSystemTable(list) {
            const tbody = document.getElementById('systemTableBody'); tbody.innerHTML = '';
            document.getElementById('widget-visible-count').innerText = list.length;
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" class="p-10 text-center text-gray-500 font-bold bg-gray-950/10">Trang mục hiện tại đang trống dữ liệu.</td></tr>';
                return;
            }
            list.forEach((item, index) => {
                const tr = document.createElement('tr'); tr.className = "hover:bg-gray-800 border-b border-gray-800 text-gray-300 text-xs";
                const actBtn = `<td class="p-3 text-right"><button type="button" onclick="deleteRecordByIndex(${index})" class="px-2 py-0.5 bg-red-950/40 text-red-400 hover:bg-red-600 hover:text-white rounded text-[10px]">Xóa hẳn</button></td>`;
                let sLabel = modules.find(m => m.id === currentWallet)?.service || '';

                // KHỐI MENU THẢ XUỐNG TỰ ĐỘNG ĐIỀU HƯỚNG WORKFLOW KHI CLICK CHỌN
                const statusSelectHtml = `
                    <select onchange="handleLiveStatusRouting(${index}, this.value)" class="bg-gray-900 border border-gray-700 rounded-lg px-2 py-1 font-bold text-xs text-white focus:border-blue-500 outline-none">
                        <option value="上架" ${item.trangthai === '上架' ? 'selected' : ''}>🟢 上架 (Lên sàn)</option>
                        <option value="下架 / tắt" ${item.trangthai !== '上架' ? 'selected' : ''}>🔴 下架 / tắt (Hạ sàn)</option>
                    </select>`;

                tr.innerHTML = `<td class="p-3 font-bold text-white">${item.ma}</td><td class="p-3 font-mono text-blue-400 font-bold">${item.stk}</td><td class="p-3 text-gray-500">${sLabel}</td>` +
                               `<td class="p-3 text-amber-500 font-black">${item.soluong}</td><td class="p-3 font-mono">${item.matkhau}</td><td class="p-3 text-gray-400">${item.ghichuextra}</td>` +
                               `<td class="p-3 text-gray-400">${item.ghichu}</td><td class="p-3">${statusSelectHtml}</td>` + actBtn;
                tbody.appendChild(tr);
            });
        }

        // TÍNH NĂNG ĐỈNH CAO: TỰ ĐỘNG NHẢY MỤC KHI ĐỔI TRẠNG THÁI TRÊN DÒNG TÙY CHỈNH
        function handleLiveStatusRouting(index, newStatus) {
            const targetIsHistory = (newStatus !== '上架');
            
            // Nếu người dùng chọn trạng thái trùng khớp với tab đang xem thì không dịch chuyển
            if (targetIsHistory === isHistoryTab) return;

            let sourceKey = getStorageKey(isHistoryTab);
            let targetKey = getStorageKey(targetIsHistory);
            
            let sourceList = JSON.parse(localStorage.getItem(sourceKey)) || [];
            let targetList = JSON.parse(localStorage.getItem(targetKey)) || [];
            
            // Cắt dòng dữ liệu cũ ra khỏi mảng
            let item = sourceList.splice(index, 1)[0];
            item.trangthai = newStatus; // Gán trạng thái mới chỉnh
            
            // Đẩy sang mảng bên kia
            targetList.unshift(item);
            
            localStorage.setItem(sourceKey, JSON.stringify(sourceList));
            localStorage.setItem(targetKey, JSON.stringify(targetList));
            
            loadLocalData(); // Vẽ lại bảng ngay lập tức
            showToast(targetIsHistory ? '🔴 Thẻ đã tự động nhảy xuống Kho Lưu Trữ (Down)!' : '🟢 Thẻ đã tự động quay trở lại phần Đang Chạy!');
        }

        function openInputModal() { document.getElementById('inputModal').classList.remove('hidden'); }
        function closeInputModal() { document.getElementById('inputModal').classList.add('hidden'); }

        function processFormSubmit(event) {
            event.preventDefault();
            const statusVal = document.getElementById('form-trangthai').value;
            const targetIsHistory = (statusVal !== '上架');

            const newItem = {
                ma: document.getElementById('form-ma').value, stk: document.getElementById('form-stk').value,
                soluong: document.getElementById('form-soluong').value, matkhau: document.getElementById('form-matkhau').value,
                ghichuextra: document.getElementById('form-ghichu-extra').value || '-', ghichu: document.getElementById('form-ghichu').value || '-',
                trangthai: statusVal
            };
            
            let list = JSON.parse(localStorage.getItem(getStorageKey(targetIsHistory))) || [];
            list.unshift(newItem); localStorage.setItem(getStorageKey(targetIsHistory), JSON.stringify(list));
            
            document.getElementById('form-ma').value = ''; document.getElementById('form-stk').value = '';
            document.getElementById('form-soluong').value = ''; document.getElementById('form-matkhau').value = '';
            
            switchModule(currentWallet, isHistoryTab);
            showToast('🚀 Hệ thống: Đã nạp và định tuyến dữ liệu thành công!');
        }

        function deleteRecordByIndex(index) {
            if(!confirm('⚠️ Xác nhận xóa bỏ vĩnh viễn dòng này khỏi máy?')) return;
            let list = JSON.parse(localStorage.getItem(getStorageKey(isHistoryTab))); list.splice(index, 1);
            localStorage.setItem(getStorageKey(isHistoryTab), JSON.stringify(list)); loadLocalData();
            showToast('🗑️ Hệ thống: Đã xóa bản ghi!');
        }

        function dangerClearTab() {
            if(!confirm('Xóa sạch toàn bộ dữ liệu của phân hệ này?')) return;
            localStorage.removeItem(getStorageKey(isHistoryTab)); loadLocalData();
        }

        function applySystemFilters() {
            const txt = document.getElementById("systemSmartSearch").value.toUpperCase();
            const sel = document.getElementById("systemStatusSelect").value.toUpperCase();
            const list = localStorage.getItem(getStorageKey(isHistoryTab)) ? JSON.parse(localStorage.getItem(getStorageKey(isHistoryTab))) : [];
            const filtered = list.filter(item => {
                const combinedStr = Object.values(item).join(" ").toUpperCase();
                return combinedStr.includes(txt) && (sel === "" || combinedStr.includes(sel));
            });
            populateSystemTable(filtered);
        }

        function showToast(msg) {
            const t = document.getElementById('toastNotification'); t.innerText = msg;
            t.className = "fixed bottom-5 right-5 px-4 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-xs uppercase rounded-xl shadow-2xl transition-all transform translate-y-0 opacity-100 z-50";
            setTimeout(() => { t.className = "fixed bottom-5 right-5 px-4 py-3 bg-gray-800 text-white font-bold text-xs uppercase rounded-xl shadow-2xl transition-all transform translate-y-20 opacity-0 z-50"; }, 3000);
        }

        switchModule('BK_Personal', false);
    </script>
</body>
</html>
