<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Super Excel Pro - Hoạt Động Hoàn Hảo</title>
    <!-- Nhúng đúng bộ thư viện Excel chuyên nghiệp -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://jsdelivr.net" type="text/css" />
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://jsdelivr.net" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #f4f6f9; color: #333; }
        header { background-color: #107c41; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .config-area { display: flex; gap: 10px; align-items: center; }
        .config-area input { padding: 6px 10px; border: none; border-radius: 4px; width: 250px; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 350px; background: white; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; padding: 15px; box-shadow: 2px 0 5px rgba(0,0,0,0.02); }
        .chat-history { flex: 1; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 4px; padding: 10px; margin-bottom: 10px; background: #fafafa; font-size: 14px; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 85%; line-height: 1.4; }
        .msg.user { background: #e1f5fe; margin-left: auto; color: #0277bd; }
        .msg.ai { background: #f1f1f1; margin-right: auto; color: #333; }
        .msg.error { background: #ffebee; color: #c62828; margin-right: auto; }
        .preview-img { max-width: 100%; max-height: 100px; margin-top: 5px; border-radius: 4px; display: block; border: 1px dashed #ccc; }
        .file-info { font-size: 12px; color: #0078d4; background: #e6f4ff; padding: 6px; border-radius: 4px; margin-top: 5px; font-weight: 500; display: none; }
        .input-group { background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #e0e0e0; margin-bottom: 8px; }
        textarea { width: 100%; height: 65px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: none; margin-bottom: 8px; font-size: 14px; }
        .btn-row { display: flex; gap: 6px; margin-bottom: 8px; }
        button { background: #107c41; color: white; border: none; padding: 10px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
        button:hover { background: #0b592e; }
        .btn-send { flex: 1; }
        .btn-media { background: #6c757d; }
        .btn-export { background: #0078d4; width: 100%; padding: 12px; font-size: 14px; }
        .content { flex: 1; padding: 20px; overflow: auto; display: flex; flex-direction: column; background: #fff; }
        .excel-outer { flex: 1; overflow: auto; border: 1px solid #ccc; border-radius: 4px; padding: 5px; }
        .loading { display: none; text-align: center; color: #666; font-size: 13px; margin-bottom: 8px; font-style: italic; }
    </style>
</head>
<body>
<header>
    <h2>📊 AI Super Excel Pro</h2>
    <div class="config-area">
        <label for="apiKey">OpenAI API Key:</label>
        <input type="password" id="apiKey" placeholder="sk-..." />
    </div>
</header>

<div class="main-container">
    <div class="sidebar">
        <h3>💬 Trợ lý AI Bảng Tính</h3>
        <p style="font-size: 11px; color: #666; margin-bottom: 8px;">Bảng bên phải cho phép sửa tay, kéo thả, Ctrl+V thoải mái như Excel.</p>
        <div class="chat-history" id="chatHistory">
            <div class="msg ai">Chào sếp! Giao diện lưới ô Excel đã được sửa lỗi hiển thị. Sếp hãy nhập API Key và kiểm tra bảng bên phải nhé!</div>
        </div>
        
        <div class="input-group">
            <textarea id="promptInput" placeholder="Nhập yêu cầu cho AI..."></textarea>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            <input type="file" id="fileInput" accept=".xlsx, .xls, .csv, .txt" style="display: none;">
            <div class="btn-row">
                <button class="btn-media" id="btnSelectImage">📷 Ảnh</button>
                <button class="btn-media" id="btnSelectFile">📁 File</button>
                <button class="btn-send" id="btnSend">Gửi lệnh</button>
            </div>
            <img id="imgPreview" class="preview-img" style="display: none;">
            <div id="fileInfoBox" class="file-info"></div>
        </div>
        
        <div class="loading" id="loadingState">AI đang phân tích và dựng bảng...</div>
        <button class="btn-export" id="btnExport">📥 Xuất file Excel (.xlsx)</button>
    </div>

    <div class="content">
        <div class="excel-outer">
            <!-- Đây là ô chứa bảng tính Excel -->
            <div id="spreadsheet"></div>
        </div>
    </div>
</div>
<script>
    const apiKeyInput = document.getElementById('apiKey');
    if (localStorage.getItem('openAiKey')) apiKeyInput.value = localStorage.getItem('openAiKey');
    apiKeyInput.addEventListener('input', () => localStorage.setItem('openAiKey', apiKeyInput.value.trim()));

    let base64Image = "";
    let extractedFileText = "";
    let excelInstance = null;

    // Khởi tạo 30 hàng dữ liệu trống mặc định
    const initialData = [];
    for (let i = 0; i < 30; i++) { initialData.push(["", "", "", "", "", "", "", "", "", ""]); }

    // HÀM DỰNG BẢNG CHUẨN ĐÚNG PHIÊN BẢN JSPREADSHEET CE
    function initExcelTable(headers, rowsData) {
        const container = document.getElementById('spreadsheet');
        container.innerHTML = ''; // Làm sạch vùng chứa cũ
        
        excelInstance = jspreadsheet(container, {
            worksheets: [{
                data: rowsData,
                columns: headers.map(h => ({ title: h, width: 120, type: 'text' })),
                minDimensions: [10, 30]
            }],
            contextMenu: true // Bật chuột phải để chèn/xóa dòng cột
        });
    }

    // Tự động kích hoạt bảng tính ngay khi tải xong trang web
    const defaultHeaders = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"];
    initExcelTable(defaultHeaders, initialData);

    // Xử lý đính kèm hình ảnh và tệp
    document.getElementById('btnSelectImage').addEventListener('click', () => document.getElementById('imageInput').click());
    document.getElementById('btnSelectFile').addEventListener('click', () => document.getElementById('fileInput').click());
    
    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            base64Image = evt.target.result;
            document.getElementById('imgPreview').src = base64Image;
            document.getElementById('imgPreview').style.display = 'block';
            document.getElementById('fileInfoBox').style.display = 'none'; extractedFileText = "";
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        document.getElementById('fileInfoBox').innerText = `📄 Đang đính kèm: ${file.name}`;
        document.getElementById('fileInfoBox').style.display = 'block';
        document.getElementById('imgPreview').style.display = 'none'; base64Image = "";

        const reader = new FileReader();
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'xlsx' || ext === 'xls') {
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const wb = bossXlsx.read(data, {type: 'array'});
                const json = bossXlsx.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
                extractedFileText = "Dữ liệu đính kèm file Excel:\n" + JSON.stringify(json);
            };
            reader.readAsArrayBuffer(file);
        } else {
            reader.onload = function(evt) { extractedFileText = "Dữ liệu file:\n" + evt.target.result; };
            reader.readAsText(file);
        }
    });

    // Hàm lấy dữ liệu trên lưới ô web để gửi cho AI
    function getTableDataFromExcelUI() {
        if (!excelInstance) return { headers: [], rows: [] };
        const ws = excelInstance.worksheets[0];
        const headers = ws.getHeaders().split(',');
        const rows = ws.getData();
        return { headers, rows };
    }

    // Gửi lệnh xử lý
    document.getElementById('btnSend').addEventListener('click', async () => {
        const prompt = document.getElementById('promptInput').value.trim();
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) return alert('Vui lòng nhập OpenAI API Key!');

        const tableState = getTableDataFromExcelUI();
        const filteredRows = tableState.rows.filter(r => r.join('').trim() !== "");
        const minimalTableState = { headers: tableState.headers, rows: filteredRows.length > 0 ? filteredRows : [[""]] };

        addMessage(prompt || "Yêu cầu AI phân tích dữ liệu bảng hiện tại.", 'user');
        document.getElementById('promptInput').value = '';
        document.getElementById('imgPreview').style.display = 'none';
        document.getElementById('fileInfoBox').style.display = 'none';
        document.getElementById('loadingState').style.display = 'block';

        const systemInstruction = `You are an AI data assistant. Analyze the user's table data and update it based on the prompt. You must return ONLY a raw valid JSON object. No chat, no markdown. 
Current Screen Sheet Data: ${JSON.stringify(minimalTableState)}.
Output JSON schema: {"headers": ["Col1", "Col2"], "rows": [["Val1", "Val2"]]}`;

        let finalPromptText = prompt;
        if (extractedFileText) finalPromptText = `${prompt}\n\n[Dữ liệu đính kèm]:\n${extractedFileText}`;

        let userContent = [{ type: "text", text: finalPromptText || "Hãy phân tích bảng dữ liệu." }];
        if (base64Image) userContent.push({ type: "image_url", image_url: { url: base64Image } });

        try {
            const response = await fetch('https://openai.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify({ 
                    model: 'gpt-4o-mini', 
                    messages: [{ role: 'system', content: systemInstruction }, { role: 'user', content: userContent }], 
                    temperature: 0.2 
                })
            });

            const result = await response.json();
            document.getElementById('loadingState').style.display = 'none';
            base64Image = ""; extractedFileText = "";

            if (result.error) return addMessage(`Lỗi: ${result.error.message}`, 'error');

            let aiContent = result.choices.message.content.trim();
            if (aiContent.startsWith('```json')) aiContent = aiContent.replace('```json', '');
            if (aiContent.endsWith('```')) aiContent = aiContent.substring(0, aiContent.length - 3);

            const parsedData = JSON.parse(aiContent.trim());
            
            if(parsedData.rows.length < 25) {
                while(parsedData.rows.length < 25) { parsedData.rows.push(new Array(parsedData.headers.length).fill("")); }
            }
            
            initExcelTable(parsedData.headers, parsedData.rows);
            addMessage('Đã đồng bộ số liệu lên bảng tính cho sếp rồi ạ!', 'ai');
        } catch (err) {
            document.getElementById('loadingState').style.display = 'none';
            addMessage(`Lỗi hệ thống: ${err.message}`, 'error');
        }
    });

    function addMessage(text, sender) {
        const history = document.getElementById('chatHistory');
        const div = document.createElement('div'); div.className = `msg ${sender}`; div.innerText = text;
        history.appendChild(div); history.scrollTop = history.scrollHeight;
    }

    document.getElementById('btnExport').addEventListener('click', () => {
        const tableState = getTableDataFromExcelUI();
        const wb = bossXlsx.utils.book_new();
        const dataArray = [tableState.headers, ...tableState.rows];
        const ws = bossXlsx.utils.aoa_to_sheet(dataArray);
        bossXlsx.utils.book_append_sheet(wb, ws, "Super_Excel");
        bossXlsx.writeFile(wb, "ai_super_excel_export.xlsx");
    });
</script>
</body>
</html>
