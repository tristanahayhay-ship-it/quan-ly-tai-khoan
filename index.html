<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Trị Tài Khoản Premium</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR MENU DỌC CHUYÊN NGHIỆP -->
        <aside class="w-64 bg-gray-950 border-r border-gray-800 p-5 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="flex items-center gap-3 px-2 py-4 border-b border-gray-800 mb-6">
                    <span class="text-sm font-black text-white">⚙️ LOCAL SYSTEM</span>
                </div>
                <nav class="space-y-1 flex flex-col text-gray-400 font-bold text-xs" id="menuNav"></nav>
            </div>
            <div class="p-3 bg-gray-900/50 rounded-xl border border-gray-800/60 text-[10px] font-bold text-emerald-400 text-center">
                <i class="fa-solid fa-database mr-1"></i> BỘ LƯU TRỮ ĐỘC LẬP
            </div>
        </aside>
        <!-- KHÔNG GIAN LÀM VIỆC CHÍNH -->
        <main class="flex-1 flex flex-col h-full bg-gray-900 overflow-y-auto">
            <header class="bg-gray-950 border-b border-gray-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                <h2 class="text-sm font-black text-white uppercase tracking-wider" id="mainHeaderTitle">BK Personal</h2>
                <div class="flex items-center gap-4">
                    <div class="text-xs font-mono font-bold text-gray-400 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-xl shadow-inner" id="liveClock">00:00:00</div>
                    <button onclick="clearAllDataInTab()" class="px-3 py-1.5 bg-red-950/40 hover:bg-red-900 border border-red-900/30 text-red-400 hover:text-white text-xs font-bold rounded-xl transition-all">Xóa sạch trang</button>
                </div>
            </header>
            
            <div class="p-6 space-y-6 max-w-7xl w-full mx-auto text-xs">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- BIỂU MẪU ĐIỀU HÀNH NHẬP LIỆU -->
                    <div class="bg-gray-950 border border-gray-800 p-5 rounded-2xl h-fit shadow-xl">
                        <h3 class="text-[11px] font-black text-gray-400 uppercase mb-4 flex items-center gap-2 pb-2 border-b border-gray-800"><i class="fa-solid fa-square-plus text-blue-500"></i> Nhập dữ liệu mới</h3>
                        <form id="systemInputForm" onsubmit="processFormSubmit(event)" class="space-y-4">
                            <div><label class="block font-bold text-gray-400 mb-1 uppercase tracking-wide">Nhà Thẻ / 卡商</label><input type="text" id="form-ma" required class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white font-bold outline-none"></div>
                            <div><label class="block font-bold text-gray-400 mb-1 uppercase tracking-wide">Số Thẻ / 卡号</label><input type="text" id="form-stk" required class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl font-mono text-white outline-none"></div>
                            <div id="form-dynamic-zone" class="space-y-4"></div>
                            <div><label class="block font-bold text-gray-400 mb-1 uppercase tracking-wide">Ghi Chú / 备注</label><input type="text" id="form-ghichu-extra" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none"></div>
                            <div><label class="block font-bold text-gray-400 mb-1 uppercase tracking-wide">Thời Gian Sử Dụng / 时间</label><input type="text" id="form-ghichu" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none"></div>
                            <div id="form-status-container"><label class="block font-bold text-gray-400 mb-1 uppercase tracking-wide">Trạng Thái / 状态</label><input type="text" id="form-trangthai" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none"></div>
                            <button type="submit" id="formSubmitBtn" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black rounded-xl uppercase tracking-wider shadow-md">Thêm Vào Hệ Thống</button>
                        </form>
                    </div>
                    <!-- KHU VỰC BẢNG HIỂN THỊ DỮ LIỆU ĐA CỘT -->
                    <div class="lg:col-span-2 space-y-4">
                        <div class="bg-gray-950 border border-gray-800 p-4 rounded-xl grid grid-cols-1 sm:grid-cols-3 gap-3 shadow-inner">
                            <div class="sm:col-span-2"><input type="text" id="systemSmartSearch" onkeyup="applySystemFilters()" placeholder="🔍 Tìm nhanh nhà thẻ, số thẻ, trạng thái..." class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none"></div>
                            <div><select id="systemStatusSelect" onchange="applySystemFilters()" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl font-bold text-gray-300 outline-none"><option value="">-- Tất cả trạng thái --</option><option value="tắt">🔴 Trạng thái Tắt</option><option value="上架">🟢 Lên sàn (上架)</option><option value="下架">🔴 Hạ sàn (下架)</option><option value="风控">🔒 Phong tỏa (风控)</option></select></div>
                        </div>
                        <div class="bg-gray-950 border border-gray-800 rounded-2xl overflow-hidden shadow-2xl">
                            <div class="p-3 bg-gray-900 text-[11px] text-gray-400 flex justify-between font-bold border-b border-gray-800"><span>DANH SÁCH DỮ LIỆU ĐANG LƯU TRÊN MÁY</span><span>Tổng: <span id="widget-visible-count" class="text-blue-400">0</span> dòng</span></div>
                            <div class="overflow-x-auto"><table class="w-full text-left border-collapse text-[11px]" id="systemMainTable"><thead><tr class="bg-gray-950 text-gray-400 uppercase text-[10px] font-black border-b border-gray-800 tracking-wider" id="systemTableHeaderRow"></tr></thead><tbody id="systemTableBody" class="divide-y divide-gray-800 font-medium"></tbody></table></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="toastNotification" class="fixed bottom-5 right-5 px-4 py-3 bg-emerald-600 border border-emerald-500 text-white font-bold text-xs uppercase rounded-xl shadow-2xl transition-all transform translate-y-20 opacity-0 z-50"></div>
    <script>
        const tabsConfig = [
            { id: 'BK_Personal', name: '💳 BK Personal', icon: 'fa-credit-card' },
            { id: 'bKash', name: '📱 Ví bKash', icon: 'fa-mobile-screen-button' },
            { id: 'Nagad', name: '🍊 Ví Nagad', icon: 'fa-wallet' },
            { id: 'Rocket', name: '🚀 Ví Rocket', icon: 'fa-rocket' },
            { id: 'StatusLog', name: '🔄 Lên / Hạ Sàn', icon: 'fa-arrows-spin' },
            { id: 'RiskCard', name: '⚠️ Thẻ Rủi Ro (风控)', icon: 'fa-shield-virus' },
            { id: 'IncidentLog', name: '🚨 Khấu Trừ / Sự Cố', icon: 'fa-triangle-exclamation' },
            { id: 'PartnerLog', name: '📅 Nhật Ký Đối Tác', icon: 'fa-calendar-days' }
        ];
        let currentActiveModule = 'BK_Personal';
        setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('vi-VN'); }, 1000);
        const menuNav = document.getElementById('menuNav');
        tabsConfig.forEach(t => {
            menuNav.innerHTML += `<button type="button" onclick="changeTab('${t.id}')" id="menu-${t.id}" class="w-full flex items-center justify-between px-3 py-2 text-left font-bold rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-all"><span>${t.name}</span></button>`;
        });

        function changeTab(m) {
            currentActiveModule = m;
            document.querySelectorAll('#menuNav button').forEach(b => b.className = "w-full flex items-center justify-between px-3 py-2 text-left font-bold rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-all");
            if(document.getElementById('menu-' + m)) document.getElementById('menu-' + m).className = "w-full flex items-center justify-between px-3 py-2 text-left font-black rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 transition-all";
            document.getElementById('main-header-title').innerText = tabsConfig.find(t => t.id === m)?.name || m;
            
            const z = document.getElementById('form-dynamic-zone'), s = document.getElementById('form-status-container');
            s.style.display = "block";
            
            if (['BK_Personal', 'bKash', 'Nagad', 'Rocket'].includes(m)) {
                z.innerHTML = '<div><label class="block font-bold text-gray-400 mb-1">HẠN MỨC / 跑量</label><input type="text" id="form-soluong" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none font-bold"></div>' + 
                              '<div><label class="block font-bold text-gray-400 mb-1">MẬT KHẨU / 密码</label><input type="text" id="form-matkhau" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none"></div>';
            } else {
                z.innerHTML = '<div><label class="block font-bold text-gray-400 mb-1">HẠN MỨC / SỐ TIỀN</label><input type="text" id="form-soluong" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none"></div>' + 
                              '<div><label class="block font-bold text-gray-400 mb-1">MẬT MÃ / DỊCH VỤ</label><input type="text" id="form-matkhau" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-white outline-none"></div>';
            }
            renderHeaderStructure(m); loadLocalData();
        }

        function renderHeaderStructure(m) {
            const h = document.getElementById('systemTableHeaderRow'); const act = '<th class="p-3 text-right">Thao Tác</th>';
            if (['BK_Personal', 'bKash', 'Nagad', 'Rocket'].includes(m)) {
                let serviceName = m === 'BK_Personal' ? 'BK Personal' : (m === 'bKash' ? 'Ví bKash' : (m === 'Nagad' ? 'Ví Nagad' : 'Ví Rocket'));
                // Render đúng 8 cột chuẩn: nhà thẻ -> số thẻ -> Tên dịch vụ -> hạn mức -> mật khẩu -> ghi chú -> thời gian sử dụng -> trạng thái
                h.innerHTML = '<th class="p-3">nhà thẻ</th><th class="p-3">số thẻ</th><th class="p-3">' + serviceName + '</th><th class="p-3">hạn mức</th><th class="p-3">mật khẩu</th><th class="p-3">ghi chú</th><th class="p-3">thời gian sử dụng</th><th class="p-3">trạng thái</th>' + act;
            } else {
                h.innerHTML = '<th class="p-3">Mã số</th><th class="p-3">Số tài khoản</th><th class="p-3">Dịch vụ</th><th class="p-3">Hạn mức/Tiền</th><th class="p-3">Mật mã</th><th class="p-3">Ghi chú</th><th class="p-3">Thời gian</th><th class="p-3">Trạng thái</th>' + act;
            }
        }
        function getStorageKey() { return 'local_db_v8_' + currentActiveModule; }
        function loadLocalData() { populateSystemTable(localStorage.getItem(getStorageKey()) ? JSON.parse(localStorage.getItem(getStorageKey())) : []); }
        
        function populateSystemTable(list) {
            const tbody = document.getElementById('systemTableBody'); tbody.innerHTML = '';
            document.getElementById('widget-visible-count').innerText = list.length;
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" class="p-10 text-center text-gray-500 font-bold">Hệ thống trống. Vui lòng nhập dữ liệu mới bên trái.</td></tr>';
                return;
            }
            list.forEach((item, index) => {
                const tr = document.createElement('tr'); tr.className = "hover:bg-gray-800 border-b border-gray-800 text-gray-300 text-xs";
                const actBtn = `<td class="p-3 text-right"><button type="button" onclick="deleteRecordByIndex(${index})" class="px-2 py-1 bg-red-900/40 hover:bg-red-600 text-red-400 hover:text-white rounded-md text-[10px]">Xóa</button></td>`;
                
                let badge = "bg-gray-800 text-gray-400 text-[10px]";
                if (item.trangthai && (item.trangthai.includes('tắt') || item.trangthai.includes('下架') || item.trangthai.includes('close'))) badge = "bg-red-500/10 border border-red-500/20 text-red-400 font-bold";
                if (item.trangthai && item.trangthai.includes('上架')) badge = "bg-green-500/10 border border-green-500/20 text-green-400 font-bold";

                let serviceLabel = currentActiveModule === 'BK_Personal' ? 'BK Personal' : (currentActiveModule === 'bKash' ? 'Ví bKash' : (currentActiveModule === 'Nagad' ? 'Ví Nagad' : 'Ví Rocket'));

                // Hiển thị chuẩn 100% thứ tự 8 cột ra màn hình màu tối
                tr.innerHTML = '<td class="p-3 font-bold text-white">' + item.ma + '</td>' +
                               '<td class="p-3 font-mono text-blue-400">' + item.stk + '</td>' +
                               '<td class="p-3 text-gray-500 font-semibold">' + serviceLabel + '</td>' +
                               '<td class="p-3 text-amber-500 font-bold">' + item.soluong + '</td>' +
                               '<td class="p-3 font-mono">' + item.matkhau + '</td>' +
                               '<td class="p-3 text-gray-400">' + item.ghichuextra + '</td>' +
                               '<td class="p-3 text-gray-400">' + item.ghichu + '</td>' +
                               '<td class="p-3"><span class="px-1.5 py-0.5 rounded ' + badge + '">' + item.trangthai + '</span></td>' + actBtn;
                tbody.appendChild(tr);
            });
        }

        function processFormSubmit(event) {
            event.preventDefault();
            const newItem = {
                ma: document.getElementById('form-ma').value,
                stk: document.getElementById('form-stk').value,
                soluong: document.getElementById('form-soluong').value,
                matkhau: document.getElementById('form-matkhau').value,
                ghichuextra: document.getElementById('form-ghichu-extra').value || '-',
                ghichu: document.getElementById('form-ghichu').value || '-',
                trangthai: document.getElementById('form-trangthai').value || '-'
            };
            const list = localStorage.getItem(getStorageKey()) ? JSON.parse(localStorage.getItem(getStorageKey())) : [];
            list.unshift(newItem); localStorage.setItem(getStorageKey(), JSON.stringify(list));
            document.getElementById('systemInputForm').reset(); changeTab(currentActiveModule);
            showToast('🚀 Đã lưu chép thành công!');
        }

        function deleteRecordByIndex(index) {
            if(!confirm('⚠️ Xác nhận xóa dòng này?')) return;
            let list = JSON.parse(localStorage.getItem(getStorageKey())); list.splice(index, 1);
            localStorage.setItem(getStorageKey(), JSON.stringify(list)); loadLocalData();
            showToast('🗑️ Đã xóa dòng thành công!');
        }

        function clearAllDataInTab() {
            if(!confirm('🚨 Xác nhận xóa sạch dữ liệu trang này?')) return;
            localStorage.removeItem(getStorageKey()); loadLocalData();
            showToast('🗑️ Đã dọn sạch phân hệ!');
        }

        function applySystemFilters() {
            const txt = document.getElementById("systemSmartSearch").value.toUpperCase();
            const sel = document.getElementById("systemStatusSelect").value.toUpperCase();
            const list = localStorage.getItem(getStorageKey()) ? JSON.parse(localStorage.getItem(getStorageKey())) : [];
            const filtered = list.filter(item => {
                const combinedStr = Object.values(item).join(" ").toUpperCase();
                return combinedStr.includes(txt) && (sel === "" || combinedStr.includes(sel));
            });
            populateSystemTable(filtered);
        }

        function showToast(msg) {
            const t = document.getElementById('toastNotification'); t.innerText = msg;
            t.className = "fixed bottom-5 right-5 px-4 py-3 bg-emerald-600 text-white font-bold text-xs uppercase rounded-xl shadow-2xl transition-all transform translate-y-0 opacity-100 z-50 shadow-lg";
            setTimeout(() => { t.className = "fixed bottom-5 right-5 px-4 py-3 bg-emerald-600 text-white font-bold text-xs uppercase rounded-xl shadow-2xl transition-all transform translate-y-20 opacity-0 z-50"; }, 2000);
        }

        changeTab('BK_Personal');
    </script>
</body>
</html>
