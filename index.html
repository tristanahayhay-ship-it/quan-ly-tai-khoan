<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Excel Gemini Robot Siêu Cấp</title>
    
    <!-- Thư viện jspreadsheet (bảng tính) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspreadsheet-ce/dist/jspreadsheet.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsuites/dist/jsuites.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/jsuites/dist/jsuites.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspreadsheet-ce/dist/jspreadsheet.min.js"></script>
    
    <!-- Thư viện ExcelJS (xuất file .xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    
    <!-- Thư viện FileSaver (tải file về máy) -->
    <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #top-bar {
            height: 50px;
            background-color: #107c41;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 16px;
            font-weight: bold;
            justify-content: space-between;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
            flex-shrink: 0;
            z-index: 100;
        }
        #export-btn {
            background-color: #ffffff;
            color: #107c41;
            border: 1px solid #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        #export-btn:hover {
            background-color: #f1f1f1;
        }
        #main-container {
            display: flex;
            position: absolute;
            top: 50px;
            bottom: 0;
            left: 0;
            right: 0;
            gap: 0;
            width: 100%;
        }
        #excel-zone {
            flex: 1;
            height: 100%;
            overflow: auto;
            padding: 15px;
            background-color: #f4f6f9;
            min-width: 400px;
        }
        #spreadsheet {
            width: 100%;
            height: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #ai-sidebar {
            flex: 0 0 380px;
            background-color: #f8f9fa;
            border-left: 2px solid #dee2e6;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        .ai-title {
            background-color: #1a73e8;
            color: white;
            padding: 12px 15px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .api-config-box {
            padding: 10px 15px;
            background-color: #e8f0fe;
            border-bottom: 1px solid #d2e3fc;
            font-size: 13px;
            flex-shrink: 0;
        }
        .api-input {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
            border: 1px solid #1a73e8;
            border-radius: 4px;
            font-size: 13px;
        }
        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #fff;
        }
        .msg {
            padding: 10px 12px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #e8f0fe;
            align-self: flex-end;
            color: #1a73e8;
            margin-right: 5px;
        }
        .bot-msg {
            background-color: #f0f0f0;
            border: 1px solid #dee2e6;
            align-self: flex-start;
            color: #212529;
            margin-left: 5px;
        }
        .chat-image-preview {
            max-width: 150px;
            border-radius: 4px;
            margin-top: 5px;
            display: block;
        }
        .controls-area {
            border-top: 1px solid #dee2e6;
            background-color: #fff;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .upload-row {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 12px;
        }
        .upload-label {
            background-color: #f1f3f4;
            color: #3c4043;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #dadce0;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .upload-label:hover {
            background-color: #e8eaed;
        }
        #file-input {
            display: none;
        }
        #file-status {
            font-size: 11px;
            color: #5f6368;
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
            flex: 1;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        #user-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            min-width: 0;
            font-size: 13px;
        }
        #send-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            font-size: 13px;
        }
        #send-btn:hover {
            background-color: #1557b0;
        }
        #send-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <span>📊 Bảng tính Excel Hệ thống kết hợp Robot Gemini Mới</span>
        <button id="export-btn" onclick="exportToExcel()">📥 Xuất file Excel (.xlsx)</button>
    </div>

    <div id="main-container">
        <!-- Vùng hiển thị ô lưới Excel -->
        <div id="excel-zone">
            <div id="spreadsheet"></div>
        </div>

        <!-- Sidebar AI -->
        <div id="ai-sidebar">
            <div class="ai-title">🤖 Robot Gemini Copilot</div>
            <div class="api-config-box">
                <label for="api-key-field"><strong>🔑 Google Gemini API Key:</strong></label>
                <input type="password" id="api-key-field" class="api-input" placeholder="Dán API Key vào đây...">
            </div>
            <div id="chat-box">
                <div class="msg bot-msg">👋 Chào! Dán Key Gemini vào trên, rồi ra lệnh gì thì tôi làm nấy!</div>
            </div>
            <div class="controls-area">
                <div class="upload-row">
                    <label for="file-input" class="upload-label">📎 Ảnh</label>
                    <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect()">
                    <span id="file-status">Chưa chọn</span>
                </div>
                <div class="input-row">
                    <input type="text" id="user-input" placeholder="Nhập lệnh..." onkeypress="if(event.key === 'Enter') sendToAI()">
                    <button id="send-btn" onclick="sendToAI()">Gửi</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFileBase64 = null;
        let selectedFileType = null;
        let tableInstance = null;

        // Khởi tạo bảng tính với jspreadsheet
        function initExcelTable() {
            try {
                let initialData = [];
                for (let i = 0; i < 20; i++) {
                    initialData.push(new Array(10).fill(''));
                }
                
                // Khởi tạo jspreadsheet
                const container = document.getElementById('spreadsheet');
                tableInstance = jspreadsheet(container, {
                    data: initialData,
                    minDimensions: [10, 20],
                    tableOverflow: true,
                    tableWidth: '100%',
                    allowInsertRow: true,
                    allowInsertColumn: true,
                    allowDeleteRow: true,
                    allowDeleteColumn: true,
                    contextMenu: true,
                    onchange: function(instance, cell, x, y, value) {
                        // Ghi log khi có thay đổi
                        console.log('Cell changed:', x, y, value);
                    }
                });
                
                console.log('✅ Bảng tính đã khởi tạo thành công');
                appendMessage('✅ Bảng tính sẵn sàng!', 'bot-msg');
                
            } catch (error) {
                console.error('❌ Lỗi khởi tạo bảng:', error);
                appendMessage('❌ Lỗi khởi tạo bảng: ' + error.message, 'bot-msg');
            }
        }

        // Chạy khi DOM sẵn sàng
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(initExcelTable, 800);
            });
        } else {
            setTimeout(initExcelTable, 800);
        }

        // Đọc ảnh thành Base64
        function handleFileSelect() {
            const fileInput = document.getElementById('file-input');
            const fileStatus = document.getElementById('file-status');
            const file = fileInput.files[0];

            if (!file) {
                selectedFileBase64 = null;
                selectedFileType = null;
                fileStatus.innerText = "Chưa chọn";
                return;
            }

            fileStatus.innerText = file.name.substring(0, 12);
            selectedFileType = file.type;

            const reader = new FileReader();
            reader.onload = function (e) {
                selectedFileBase64 = e.target.result.split(',')[1];
                console.log('✅ Ảnh đã được load');
            };
            reader.readAsDataURL(file);
        }

        // Gửi yêu cầu tới Gemini API
        async function sendToAI() {
            let inputField = document.getElementById('user-input');
            let apiKeyField = document.getElementById('api-key-field');
            let query = inputField.value.trim();
            let apiKey = apiKeyField.value.trim();

            if (!query && !selectedFileBase64) {
                alert("Vui lòng nhập lệnh hoặc chọn ảnh!");
                return;
            }
            if (!apiKey) {
                alert("Vui lòng điền API Key Gemini!");
                return;
            }

            // Hiển thị tin nhắn người dùng
            let chatBox = document.getElementById('chat-box');
            let userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'msg user-msg';
            userMsgDiv.innerText = query || "📸 Đã gửi hình ảnh";
            
            if (selectedFileBase64) {
                let imgPreview = document.createElement('img');
                imgPreview.src = `data:${selectedFileType};base64,${selectedFileBase64}`;
                imgPreview.className = 'chat-image-preview';
                userMsgDiv.appendChild(imgPreview);
            }
            chatBox.appendChild(userMsgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            inputField.value = '';
            let loadingId = appendMessage("⏳ Robot đang xử lý...", 'bot-msg');

            try {
                // Prompt chi tiết cho Gemini
                const promptInstruct = `${query || "Đọc bảng dữ liệu trong ảnh"}

Bạn là trợ lý ảo điền dữ liệu vào bảng tính Excel. Phân tích ảnh hoặc yêu cầu của người dùng, tạo dữ liệu theo yêu cầu.

QUAN TRỌNG: Trả về CHỈ một mảng JSON, không có chữ giải thích:
[{"row": 0, "col": 0, "val": "Tên Nhân Viên"}, {"row": 1, "col": 0, "val": "Nguyễn Văn A"}]

Quy tắc:
- Hàng A1, B1, C1... → row: 0
- Cột A, B, C... → col: 0, 1, 2...
- Công thức Excel: val = "=SUM(B2:B10)"
- Số: val = "1000" hoặc "1000.50"
- Chữ: val = "Tên Nhân Viên"
- CHỈ trả về JSON, không có markdown, không có giải thích`;

                let parts = [{ text: promptInstruct }];
                
                // Nếu có ảnh, thêm vào request
                if (selectedFileBase64) {
                    parts.push({
                        inlineData: {
                            mimeType: selectedFileType,
                            data: selectedFileBase64
                        }
                    });
                }

                // Gọi Gemini API với model gemini-pro-vision (hỗ trợ hình ảnh)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro-vision:generateContent?key=${apiKey}`;
                
                console.log('🚀 Gọi API Gemini:', url);
                
                const response = await fetch(url, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ 
                        contents: [{
                            parts: parts
                        }],
                        generationConfig: {
                            temperature: 0.1,
                            maxOutputTokens: 2048
                        }
                    })
                });

                console.log('📡 Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ API Error:', errorText);
                    document.getElementById(loadingId).innerText = "❌ Lỗi API: " + response.status;
                    return;
                }

                const rawData = await response.json();
                console.log('📨 Response từ Gemini:', rawData);
                
                if (rawData.error) {
                    document.getElementById(loadingId).innerText = "❌ Lỗi: " + rawData.error.message;
                    return;
                }

                if (!rawData.candidates || !rawData.candidates[0] || !rawData.candidates[0].content) {
                    document.getElementById(loadingId).innerText = "❌ Gemini không phản hồi";
                    return;
                }

                let aiTextResponse = rawData.candidates[0].content.parts[0].text.trim();
                console.log('📝 Text response:', aiTextResponse);
                
                // Bỏ markdown code blocks
                if (aiTextResponse.includes("```")) {
                    aiTextResponse = aiTextResponse.replace(/```json\n?|\n?```/g, "").trim();
                }

                // Parse JSON
                let cellDataArray = JSON.parse(aiTextResponse);
                console.log('✅ Parsed JSON:', cellDataArray);
                
                if (Array.isArray(cellDataArray) && cellDataArray.length > 0) {
                    let successCount = 0;
                    cellDataArray.forEach(cell => {
                        if (tableInstance && typeof cell.row !== 'undefined' && typeof cell.col !== 'undefined' && cell.val !== null) {
                            try {
                                tableInstance.setValueFromCoords(cell.col, cell.row, String(cell.val));
                                successCount++;
                            } catch (e) {
                                console.error('Lỗi set cell:', e, cell);
                            }
                        }
                    });
                    document.getElementById(loadingId).innerText = `✅ Đã điền ${successCount} ô dữ liệu!`;
                } else {
                    document.getElementById(loadingId).innerText = "⚠️ Không tìm được dữ liệu hợp lệ";
                }

            } catch (error) {
                console.error("Chi tiết lỗi:", error);
                document.getElementById(loadingId).innerText = "❌ Lỗi: " + error.message;
            } finally {
                document.getElementById('file-input').value = "";
                document.getElementById('file-status').innerText = "Chưa chọn";
                selectedFileBase64 = null; 
                selectedFileType = null;
            }
        }

        // Xuất file Excel
        function exportToExcel() {
            if (!tableInstance) {
                alert("Bảng tính trống!");
                return;
            }
            
            try {
                let data = tableInstance.getData();
                
                let workbook = new ExcelJS.Workbook();
                let worksheet = workbook.addWorksheet('Báo Cáo');

                data.forEach((row, rowIndex) => {
                    row.forEach((cellValue, colIndex) => {
                        if (cellValue !== '' && cellValue !== null && cellValue !== undefined) {
                            let cellObj = worksheet.getCell(rowIndex + 1, colIndex + 1);
                            if (typeof cellValue === 'string' && cellValue.startsWith('=')) {
                                cellObj.value = { formula: cellValue.substring(1) };
                            } else {
                                cellObj.value = cellValue;
                            }
                        }
                    });
                });

                workbook.xlsx.writeBuffer().then(buffer => {
                    saveAs(new Blob([buffer]), "Báo_Cáo_Excel.xlsx");
                    appendMessage("✅ File Excel đã tải xuống!", 'bot-msg');
                }).catch(err => {
                    console.error("Lỗi xuất file:", err);
                    appendMessage("❌ Lỗi xuất file", 'bot-msg');
                });
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Lỗi: " + error.message);
            }
        }

        function appendMessage(text, className) {
            let chatBox = document.getElementById('chat-box');
            let msgDiv = document.createElement('div');
            let uniqueId = "msg-" + Date.now();
            msgDiv.id = uniqueId; 
            msgDiv.className = `msg ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return uniqueId;
        }
    </script>
</body>
</html>
